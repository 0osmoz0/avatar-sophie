[package]
name = "avatar-sophie"
version = "0.1.0"
description = "Sophie, un compagnon de bureau 2D kawaii"
authors = ["0osmoz0"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "avatar_sophie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# macos-private-api est obligatoire : sans elle, transparent:true est ignore
# par macOS et la fenetre reste opaque.
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Shim AppKit : niveau de fenetre, collectionBehavior multi-Spaces, ombre et
# politique d'activation ne sont pas exposes par l'API Tauri.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWindow",
    "NSPanel",
    "NSResponder",
    "NSView",
    "NSApplication",
    "NSColor",
    "NSGraphics",
    "NSScreen",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSGeometry",
    "NSArray",
    "NSValue",
    "NSNotification",
    "NSOperation",
    "block2",
] }
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.24"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
